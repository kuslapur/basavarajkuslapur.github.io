<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basavaraj | DevOps & SRE Engineer</title>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-XXXXXXX');
</script>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body { font-family: 'Syne', sans-serif; background:#0a0c0f; color:#fff; }
.section { padding:40px; }
.card { background:#111; padding:20px; margin:10px; border-radius:8px; }
.light-mode { background:#fff; color:#000; }
</style>
</head>

<body>

<nav>
<h3>Basavaraj Portfolio</h3>
<button id="themeToggle">🌙</button>
</nav>

<section class="section">
<h2>GitHub Projects</h2>
<div id="repoList"></div>
</section>

<section class="section">
<h2>GitHub Contributions</h2>
<img src="https://ghchart.rshah.org/00e5a0/YOUR_GITHUB_USERNAME" width="90%">
</section>

<section class="section">
<h2>Visitor Counter</h2>
<img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https://bkuslapur.online">
</section>

<section class="section">
<h2>Download Resume</h2>
<a href="resume.pdf" download>Download Resume</a>
</section>

<script>
// theme toggle
const toggle = document.getElementById("themeToggle");
toggle.onclick = () => {
 document.body.classList.toggle("light-mode");
};

// github repos
const username = "YOUR_GITHUB_USERNAME";

fetch(`https://api.github.com/users/${username}/repos`)
.then(res => res.json())
.then(data => {
 let html = "";
 data.slice(0,6).forEach(repo => {
  html += `<div class="card">
    <h3>${repo.name}</h3>
    <p>${repo.description || "No description"}</p>
    <a href="${repo.html_url}" target="_blank">View Repo</a>
  </div>`;
 });
 document.getElementById("repoList").innerHTML = html;
});
</script>

</body>
</html>
